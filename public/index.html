<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChempBoard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #030813;
      --panel: #202b3a;
      --panel-soft: #14202d;
      --panel-strong: #111827;
      --topbar: #245f5c;
      --line: #374456;
      --line-soft: rgba(148, 163, 184, 0.18);
      --ink: #eef4fb;
      --muted: #aab3c2;
      --faint: #728097;
      --teal: #5eead4;
      --green: #86efac;
      --blue: #93c5fd;
      --cyan: #67e8f9;
      --amber: #fcd34d;
      --red: #fca5a5;
      --danger: #7f1d1d;
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.18);
    }
    html, body { min-width: 320px; min-height: 100%; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #06101d 0%, var(--bg) 19rem);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; }
    button {
      color: inherit;
      border: 0;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    a { color: inherit; text-decoration: none; }
    input, select, textarea {
      width: 100%;
      min-height: 2.65rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--panel-strong);
      color: var(--ink);
      padding: 0.62rem 0.75rem;
    }
    textarea {
      min-height: 6rem;
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.15);
    }
    label > span {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 850;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(36, 95, 92, 0.96);
      border-bottom: 1px solid rgba(179, 228, 226, 0.18);
      backdrop-filter: blur(18px);
    }
    .topbar-inner {
      width: min(100%, 1840px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      padding: 0.86rem 1.1rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      background: transparent;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .brand-mark {
      display: inline-flex;
      width: 2.05rem;
      height: 2.05rem;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(94, 234, 212, 0.38);
      border-radius: 8px;
      background: #13544d;
      color: #ecfeff;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.1rem;
      flex-wrap: wrap;
    }
    .nav-link {
      background: transparent;
      color: #d9f2f1;
      border-radius: 999px;
      padding: 0.42rem 0.7rem;
      font-weight: 780;
      transition: background 140ms ease, color 140ms ease;
    }
    .nav-link:hover, .nav-link.active {
      background: rgba(13, 31, 44, 0.38);
      color: #fff;
    }
    .topbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.55rem;
      min-width: 0;
    }
    .user-name {
      max-width: 13rem;
      overflow: hidden;
      color: #d9f2f1;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .primary-button,
    .secondary-button,
    .danger-button,
    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      min-height: 2.45rem;
      border-radius: 8px;
      padding: 0.48rem 0.72rem;
      font-weight: 850;
      white-space: nowrap;
    }
    .primary-button {
      border: 1px solid rgba(94, 234, 212, 0.34);
      background: #0f766e;
      color: #ecfeff;
    }
    .primary-button:hover { background: #0d9488; }
    .secondary-button, .ghost-button {
      border: 1px solid rgba(217, 242, 241, 0.18);
      background: rgba(13, 31, 44, 0.55);
      color: #e9fffe;
    }
    .secondary-button:hover, .ghost-button:hover { background: rgba(13, 31, 44, 0.75); }
    .danger-button {
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(127, 29, 29, 0.62);
      color: #fecaca;
    }
    .page-frame {
      width: min(100%, 1840px);
      margin: 0 auto;
      padding: 1.35rem 1.1rem 3rem;
    }
    .page-stack {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .page-title,
    .panel,
    .stat-card,
    .resource-card,
    .log-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .page-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 5.8rem;
      padding: 1.35rem 1.55rem;
      background: #1c4a47;
    }
    .page-title h1,
    .panel h2,
    .resource-card h2,
    .log-panel h2 {
      margin: 0;
      color: #f8fafc;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .page-title h1 { font-size: clamp(1.55rem, 2vw, 2rem); }
    .page-title p,
    .panel-heading p,
    .resource-card span,
    .muted {
      color: var(--muted);
      font-weight: 700;
    }
    .page-title p,
    .panel-heading p {
      margin: 0.35rem 0 0;
    }
    .page-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .notice {
      display: none;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 8px;
      background: rgba(127, 29, 29, 0.42);
      color: #fecaca;
      padding: 0.8rem 1rem;
      font-weight: 750;
    }
    .notice.show { display: block; }
    .notice.ok {
      border-color: rgba(134, 239, 172, 0.34);
      background: rgba(22, 101, 52, 0.26);
      color: #bbf7d0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }
    .stat-card {
      display: flex;
      min-height: 8rem;
      flex-direction: column;
      justify-content: center;
      gap: 0.38rem;
      padding: 1rem;
      background: var(--panel-strong);
    }
    .stat-card span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .stat-card strong {
      color: #f8fafc;
      font-size: clamp(1.45rem, 3vw, 2.1rem);
      line-height: 1;
      overflow-wrap: anywhere;
    }
    .stat-card small {
      color: var(--faint);
      font-weight: 750;
    }
    .tone-cyan strong { color: var(--cyan); }
    .tone-green strong { color: var(--green); }
    .tone-blue strong { color: var(--blue); }
    .tone-amber strong { color: var(--amber); }
    .tone-red strong { color: var(--red); }
    .panel, .log-panel {
      padding: 1.1rem;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .panel-heading h2,
    .log-panel h2 {
      font-size: 1.18rem;
    }
    .control-panel {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
    }
    .inline-field {
      min-width: min(24rem, 100%);
    }
    .dashboard-layout,
    .split-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(23rem, 0.65fr);
      gap: 1rem;
      align-items: start;
    }
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(21rem, 1fr));
      gap: 1rem;
    }
    .resource-grid.compact {
      grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    }
    .resource-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 0.82rem;
      padding: 1rem;
    }
    .resource-card header,
    .status-row,
    .table-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .resource-card h2 {
      font-size: 1.08rem;
      overflow-wrap: anywhere;
    }
    .resource-card p {
      margin: 0;
      color: #d5dde8;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .status-dot {
      width: 0.75rem;
      height: 0.75rem;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--faint);
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12);
    }
    .status-dot.up { background: var(--green); box-shadow: 0 0 0 4px rgba(134, 239, 172, 0.13); }
    .status-dot.warn { background: var(--amber); box-shadow: 0 0 0 4px rgba(252, 211, 77, 0.13); }
    .status-dot.down { background: var(--red); box-shadow: 0 0 0 4px rgba(252, 165, 165, 0.13); }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.22rem 0.6rem;
      background: rgba(13, 148, 136, 0.18);
      color: #b6f3ee;
      font-size: 0.76rem;
      font-weight: 850;
    }
    .chip.blue { background: rgba(37, 99, 235, 0.2); color: #bfdbfe; }
    .chip.green { background: rgba(22, 163, 74, 0.18); color: #86efac; }
    .chip.amber { background: rgba(245, 158, 11, 0.18); color: #fde68a; }
    .chip.red { background: rgba(127, 29, 29, 0.42); color: #fecaca; }
    .table {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .table-row {
      justify-content: space-between;
      min-width: 0;
      min-height: 3.1rem;
      padding: 0.72rem 0.85rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .table-row > div {
      min-width: 0;
    }
    .table-row strong {
      display: block;
      color: #f8fafc;
      overflow-wrap: anywhere;
    }
    .table-row span {
      display: block;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .metric-list {
      display: grid;
      gap: 0.6rem;
    }
    .metric-row {
      display: grid;
      grid-template-columns: minmax(7rem, 0.35fr) minmax(0, 1fr);
      gap: 0.75rem;
      align-items: center;
      color: #d5dde8;
    }
    .metric-row strong {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .bar {
      height: 0.54rem;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
    }
    .bar > span {
      display: block;
      height: 100%;
      width: var(--value, 0%);
      max-width: 100%;
      border-radius: inherit;
      background: var(--green);
    }
    .bar.warn > span { background: var(--amber); }
    .bar.danger > span { background: var(--red); }
    .log-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(24rem, 1fr));
      gap: 1rem;
    }
    .log-panel pre {
      max-height: 34rem;
      margin: 0.8rem 0 0;
      overflow: auto;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #07101d;
      color: #dbeafe;
      padding: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font: 0.82rem ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .empty-state {
      border: 1px dashed rgba(148, 163, 184, 0.38);
      border-radius: 8px;
      padding: 1.3rem;
      color: var(--muted);
      background: rgba(20, 32, 45, 0.5);
      font-weight: 750;
      text-align: center;
    }
    dialog {
      width: min(620px, calc(100% - 32px));
      border: 0;
      border-radius: 8px;
      padding: 0;
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }
    dialog::backdrop { background: rgba(3, 8, 19, 0.68); }
    .modal-head,
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .modal-head h2 {
      margin: 0;
      font-size: 1.1rem;
    }
    .modal-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
      padding: 1.1rem;
    }
    .settings-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }
    .settings-form .full { grid-column: 1 / -1; }
    .settings-section {
      display: grid;
      gap: 0.9rem;
      align-content: start;
      padding: 1rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .settings-section h2 {
      margin: 0;
      font-size: 1.08rem;
    }
    .modal-form .full { grid-column: 1 / -1; }
    .modal-actions {
      grid-column: 1 / -1;
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
      margin: 0 -1.1rem -1.1rem;
    }
    .check-label {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: #d5dde8;
      font-weight: 800;
    }
    .check-label input {
      width: 1.1rem;
      min-height: auto;
      height: 1.1rem;
    }
    .hidden { display: none !important; }
    @media (max-width: 1120px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dashboard-layout, .split-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      .topbar-inner { align-items: flex-start; flex-direction: column; }
      .topbar-actions { width: 100%; justify-content: space-between; }
      .nav-links { width: 100%; }
      .page-title { align-items: flex-start; flex-direction: column; }
      .control-panel { align-items: stretch; flex-direction: column; }
      .page-actions { width: 100%; justify-content: stretch; }
      .page-actions > * { flex: 1 1 auto; }
      .resource-grid, .log-grid { grid-template-columns: 1fr; }
      .modal-form, .settings-form { grid-template-columns: 1fr; }
      .metric-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .stats-grid { grid-template-columns: 1fr; }
      .table-row { align-items: flex-start; flex-direction: column; }
      .user-name { max-width: 10rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="brand-btn" type="button">
        <span class="brand-mark">B</span>
        <span>ChempBoard</span>
      </button>
      <nav class="nav-links" aria-label="Main">
        <button class="nav-link" data-route="overview" type="button">Overview</button>
        <button class="nav-link" data-route="nas" type="button">NAS</button>
        <button class="nav-link" data-route="wake" type="button">Wake</button>
        <button class="nav-link" data-route="homeassistant" type="button">Home Assistant</button>
        <button class="nav-link" data-route="unifi" type="button">UniFi</button>
        <button class="nav-link" data-route="sites" type="button">Sites</button>
        <button class="nav-link" data-route="logs" type="button">Logs</button>
        <button class="nav-link hidden" data-route="settings" data-admin-route="true" type="button">Settings</button>
      </nav>
      <div class="topbar-actions">
        <span class="user-name" id="session-name">Loading...</span>
        <button class="secondary-button" id="logout-btn" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="page-frame">
    <div class="page-stack">
      <section class="page-title">
        <div>
          <h1 id="page-heading">Overview</h1>
          <p id="page-copy">Loading dashboard...</p>
        </div>
        <div class="page-actions">
          <button class="secondary-button" id="refresh-btn" type="button">Refresh</button>
          <button class="primary-button hidden" id="add-wake-btn" type="button">Add machine</button>
          <button class="primary-button hidden" id="add-site-btn" type="button">Add site</button>
        </div>
      </section>
      <div class="notice" id="notice"></div>
      <section id="content" aria-live="polite"></section>
    </div>
  </main>

  <dialog id="site-dialog">
    <form method="dialog" class="modal-head">
      <h2 id="site-dialog-title">Add site</h2>
      <button class="secondary-button" type="submit">Close</button>
    </form>
    <form class="modal-form" id="site-form">
      <label>
        <span>Name</span>
        <input id="site-name" name="name" required maxlength="100" />
      </label>
      <label>
        <span>Group</span>
        <input id="site-group" name="group" maxlength="80" />
      </label>
      <label class="full">
        <span>URL</span>
        <input id="site-url" name="url" type="url" required />
      </label>
      <label>
        <span>Kind</span>
        <input id="site-kind" name="kind" maxlength="40" />
      </label>
      <label>
        <span>Method</span>
        <select id="site-method" name="method">
          <option value="GET">GET</option>
          <option value="HEAD">HEAD</option>
        </select>
      </label>
      <label>
        <span>Timeout ms</span>
        <input id="site-timeout" name="timeoutMs" type="number" min="1000" max="60000" step="500" />
      </label>
      <label>
        <span>Tags</span>
        <input id="site-tags" name="tags" placeholder="network, family" />
      </label>
      <label class="check-label full">
        <input id="site-enabled" name="enabled" type="checkbox" checked />
        Enabled
      </label>
      <div class="notice full" id="site-form-status"></div>
      <div class="modal-actions">
        <button class="secondary-button" id="site-cancel-btn" type="button">Cancel</button>
        <button class="primary-button" id="site-save-btn" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="wake-dialog">
    <form method="dialog" class="modal-head">
      <h2 id="wake-dialog-title">Add machine</h2>
      <button class="secondary-button" type="submit">Close</button>
    </form>
    <form class="modal-form" id="wake-form">
      <label>
        <span>Name</span>
        <input id="wake-name" name="name" required maxlength="100" />
      </label>
      <label>
        <span>MAC address</span>
        <input id="wake-mac" name="mac" required placeholder="AA:BB:CC:DD:EE:FF" autocomplete="off" />
      </label>
      <label>
        <span>Broadcast</span>
        <input id="wake-broadcast" name="broadcast" required placeholder="255.255.255.255" autocomplete="off" />
      </label>
      <label>
        <span>Port</span>
        <input id="wake-port" name="port" type="number" min="0" max="65535" required />
      </label>
      <label class="full">
        <span>Tags</span>
        <input id="wake-tags" name="tags" placeholder="office, nas, family" autocomplete="off" />
      </label>
      <label class="full">
        <span>Description</span>
        <input id="wake-description" name="description" maxlength="280" />
      </label>
      <label class="check-label full">
        <input id="wake-enabled" name="enabled" type="checkbox" checked />
        Enabled
      </label>
      <div class="notice full" id="wake-form-status"></div>
      <div class="modal-actions">
        <button class="secondary-button" id="wake-cancel-btn" type="button">Cancel</button>
        <button class="primary-button" id="wake-save-btn" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    const routes = {
      overview: ['Overview', 'NAS, Home Assistant, UniFi, and site status'],
      nas: ['NAS', 'Host uptime, disks, containers, network, and logs'],
      wake: ['Wake', 'Wake-on-LAN machines and recent wake requests'],
      homeassistant: ['Home Assistant', 'States, logbook, error log, and API reachability'],
      unifi: ['UniFi', 'Network health, devices, clients, events, and alarms'],
      sites: ['Sites', 'Configured status checks'],
      logs: ['Logs', 'Recent NAS, Home Assistant, and UniFi records'],
      settings: ['Settings', 'Integration URLs, keys, disks, and wake defaults'],
    };

    const state = {
      route: normalizeRoute(location.hash.replace('#', '') || 'overview'),
      user: null,
      app: null,
      data: null,
      settings: null,
      loading: false,
      editingSiteId: null,
      editingWakeDeviceId: null,
      wakeMessages: new Map(),
    };

    const content = document.getElementById('content');
    const notice = document.getElementById('notice');
    const addSiteBtn = document.getElementById('add-site-btn');
    const addWakeBtn = document.getElementById('add-wake-btn');
    const siteDialog = document.getElementById('site-dialog');
    const siteForm = document.getElementById('site-form');
    const siteStatus = document.getElementById('site-form-status');
    const wakeDialog = document.getElementById('wake-dialog');
    const wakeForm = document.getElementById('wake-form');
    const wakeStatus = document.getElementById('wake-form-status');

    document.querySelectorAll('[data-route]').forEach(button => {
      button.addEventListener('click', () => navigate(button.dataset.route));
    });
    document.getElementById('brand-btn').addEventListener('click', () => navigate('overview'));
    document.getElementById('refresh-btn').addEventListener('click', refreshDashboard);
    document.getElementById('logout-btn').addEventListener('click', logout);
    addWakeBtn.addEventListener('click', () => openWakeDialog());
    addSiteBtn.addEventListener('click', () => openSiteDialog());
    document.getElementById('site-cancel-btn').addEventListener('click', () => siteDialog.close());
    document.getElementById('wake-cancel-btn').addEventListener('click', () => wakeDialog.close());
    siteForm.addEventListener('submit', saveSite);
    wakeForm.addEventListener('submit', saveWakeDevice);
    window.addEventListener('hashchange', () => {
      state.route = normalizeRoute(location.hash.replace('#', '') || 'overview');
      render();
    });

    bootstrap();
    setInterval(() => {
      if (!document.hidden) refreshDashboard({ quiet: true });
    }, 60000);

    async function bootstrap() {
      try {
        const session = await api('/api/auth/me');
        state.user = session.user;
        state.app = session.app;
        document.getElementById('session-name').textContent = state.user.display_name || state.user.username;
        await refreshDashboard();
      } catch (error) {
        if (error.status === 401 || error.status === 403) location.href = '/login';
        showNotice(error.message);
      }
    }

    async function refreshDashboard(options = {}) {
      state.loading = true;
      if (!options.quiet) renderLoading();
      try {
        const [dashboard, settings] = await Promise.all([
          api('/api/dashboard'),
          state.user?.is_admin ? api('/api/settings') : Promise.resolve(null),
        ]);
        state.data = dashboard;
        if (settings?.settings) state.settings = settings.settings;
        state.loading = false;
        showNotice('');
        render();
      } catch (error) {
        state.loading = false;
        showNotice(error.message);
        render();
      }
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || 'Request failed');
        error.status = response.status;
        error.data = data;
        if (Array.isArray(data.attempts)) error.attempts = data.attempts;
        throw error;
      }
      return data;
    }

    function navigate(route) {
      const next = normalizeRoute(route);
      if (state.route === next) return;
      location.hash = next;
    }

    function normalizeRoute(route) {
      return routes[route] ? route : 'overview';
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login';
    }

    function showNotice(message) {
      notice.textContent = message || '';
      notice.classList.toggle('show', !!message);
    }

    function renderLoading() {
      content.innerHTML = '<div class="empty-state">Loading...</div>';
    }

    function render() {
      const [title, copy] = routes[state.route];
      document.getElementById('page-heading').textContent = title;
      document.getElementById('page-copy').textContent = state.data?.collectedAt ? `${copy} - ${formatDate(state.data.collectedAt)}` : copy;
      document.querySelectorAll('[data-route]').forEach(button => {
        button.classList.toggle('active', button.dataset.route === state.route);
        if (button.dataset.adminRoute) button.classList.toggle('hidden', !state.user?.is_admin);
      });
      addSiteBtn.classList.toggle('hidden', state.route !== 'sites' || !state.user?.is_admin);
      addWakeBtn.classList.toggle('hidden', state.route !== 'wake' || !state.user?.is_admin);

      if (!state.data) {
        renderLoading();
        return;
      }

      if (state.route === 'overview') content.innerHTML = renderOverview();
      if (state.route === 'nas') content.innerHTML = renderNas();
      if (state.route === 'wake') {
        content.innerHTML = renderWake();
        bindWakeButtons();
      }
      if (state.route === 'homeassistant') content.innerHTML = renderHomeAssistant();
      if (state.route === 'unifi') {
        content.innerHTML = renderUniFi();
        bindUniFiControls();
      }
      if (state.route === 'sites') {
        content.innerHTML = renderSites();
        bindSiteButtons();
      }
      if (state.route === 'logs') content.innerHTML = renderLogs();
      if (state.route === 'settings') {
        content.innerHTML = renderSettings();
        bindSettingsForm();
      }
    }

    function renderOverview() {
      const data = state.data;
      const nas = data.nas || {};
      const ha = data.homeAssistant || {};
      const unifi = data.unifi || {};
      const sites = data.sites || {};
      const wake = data.wake || {};
      return `
        <div class="page-stack">
          <div class="stats-grid">
            ${statCard('NAS uptime', formatDuration(nas.uptime?.seconds), nas.load ? `Load ${nas.load.one} / ${nas.load.five} / ${nas.load.fifteen}` : 'No load data', 'cyan')}
            ${statCard('Memory', percentText(nas.memory?.usedPercent), formatBytes(nas.memory?.used || 0) + ' used', memoryTone(nas.memory?.usedPercent))}
            ${statCard('Wake machines', String(wake.enabled || 0), `${wake.total || 0} configured`, wake.enabled ? 'green' : 'amber')}
            ${statCard('Home Assistant', ha.configured ? String(ha.states?.total || 0) : 'Off', ha.configured ? `${ha.states?.problems?.length || 0} problem states` : ha.error || 'Not configured', ha.ok ? 'green' : 'amber')}
            ${statCard('UniFi clients', unifi.configured ? String(unifi.clients?.total || 0) : 'Off', unifi.configured ? `${unifi.devices?.offline || 0} offline devices` : unifi.error || 'Not configured', unifi.ok ? 'blue' : 'amber')}
          </div>
          <div class="dashboard-layout">
            <section class="panel">
              <div class="panel-heading">
                <div><h2>Service status</h2><p>${formatDate(data.collectedAt)}</p></div>
              </div>
              <div class="resource-grid compact">
                ${serviceCard('NAS', nas.ok !== false, nas.procPath || '', `${(nas.disks || []).length} disks - ${nas.docker?.running || 0}/${nas.docker?.total || 0} containers running`)}
                ${serviceCard('Wake-on-LAN', true, `${wake.enabled || 0}/${wake.total || 0} enabled`, wake.lastWakeAt ? `Last wake ${formatDate(wake.lastWakeAt)}` : 'No wake requests yet')}
                ${serviceCard('Home Assistant', !!ha.ok, ha.configured ? ha.baseUrl : ha.error, ha.configured ? `${ha.servicesCount || 0} services - ${ha.eventsCount || 0} event types` : 'Set HOME_ASSISTANT_URL and token')}
                ${serviceCard('UniFi Network', !!unifi.ok, unifi.configured ? unifi.baseUrl : unifi.error, unifi.configured ? `${unifi.devices?.total || 0} devices - site ${escapeHtml(unifi.site || '')}` : 'Set UniFi credentials')}
                ${serviceCard('Sites', (sites.down || 0) === 0, `${sites.up || 0}/${sites.total || 0} reachable`, `${sites.down || 0} down - ${sites.disabled || 0} disabled`)}
              </div>
            </section>
            <section class="panel">
              <div class="panel-heading">
                <div><h2>Fast signals</h2><p>Highest attention items</p></div>
              </div>
              <div class="table">
                ${attentionRows().join('') || '<div class="empty-state">No attention items.</div>'}
              </div>
            </section>
          </div>
          <section class="panel">
            <div class="panel-heading">
              <div><h2>Sites</h2><p>${sites.up || 0} reachable, ${sites.down || 0} down</p></div>
            </div>
            <div class="resource-grid compact">
              ${(sites.sites || []).slice(0, 8).map(siteCard).join('') || '<div class="empty-state">No sites configured.</div>'}
            </div>
          </section>
        </div>
      `;
    }

    function renderWake() {
      const wake = state.data.wake || {};
      const devices = wake.devices || [];
      return `
        <div class="page-stack">
          <div class="stats-grid">
            ${statCard('Machines', String(wake.total || 0), `${wake.enabled || 0} enabled`, 'cyan')}
            ${statCard('Disabled', String(wake.disabled || 0), 'Skipped for wake requests', wake.disabled ? 'amber' : 'green')}
            ${statCard('Last wake', wake.lastWakeAt ? formatDate(wake.lastWakeAt) : '-', 'Most recent request', wake.lastWakeAt ? 'green' : 'blue')}
            ${statCard('Log entries', String((wake.log || []).length), 'Stored recent wake requests', 'blue')}
          </div>
          <section class="panel">
            <div class="panel-heading">
              <div><h2>Machines</h2><p>${devices.length} configured machines</p></div>
            </div>
            <div class="resource-grid">
              ${devices.map(wakeDeviceCard).join('') || '<div class="empty-state">No wake machines configured.</div>'}
            </div>
          </section>
          <section class="panel">
            <div class="panel-heading">
              <div><h2>Wake log</h2><p>${(wake.log || []).length} recent entries</p></div>
            </div>
            <div class="table">
              ${(wake.log || []).slice(0, 80).map(entry => tableRow(entry.deviceName || entry.deviceId, `${entry.ok ? 'Sent' : 'Failed'} by ${entry.displayName || entry.username || '-'}`, wakeLogMeta(entry))).join('') || '<div class="empty-state">No wake requests yet.</div>'}
            </div>
          </section>
        </div>
      `;
    }

    function attentionRows() {
      const rows = [];
      const ha = state.data.homeAssistant || {};
      const unifi = state.data.unifi || {};
      const sites = state.data.sites || {};
      for (const site of (sites.sites || []).filter(item => item.state === 'down').slice(0, 6)) {
        rows.push(tableRow(site.name, site.error || `HTTP ${site.httpStatus || '-'}`, 'Site down'));
      }
      for (const entity of (ha.states?.problems || []).slice(0, 6)) {
        rows.push(tableRow(entity.name || entity.entity_id, entity.reason || entity.state, 'Home Assistant'));
      }
      for (const device of (unifi.devices?.rows || []).filter(item => item.state !== 1 && item.state !== '1').slice(0, 6)) {
        rows.push(tableRow(device.name || device.mac, device.model || device.type || 'Device offline', 'UniFi'));
      }
      return rows.slice(0, 10);
    }

    function renderNas() {
      const nas = state.data.nas || {};
      return `
        <div class="page-stack">
          <div class="stats-grid">
            ${statCard('Uptime', formatDuration(nas.uptime?.seconds), nas.uptime?.bootedAt ? `Booted ${formatDate(nas.uptime.bootedAt)}` : '-', 'cyan')}
            ${statCard('Load 1m', nas.load?.one ?? '-', nas.cpu?.cores ? `${nas.cpu.cores} cores` : nas.cpu?.model || '-', 'blue')}
            ${statCard('Memory', percentText(nas.memory?.usedPercent), `${formatBytes(nas.memory?.available || 0)} available`, memoryTone(nas.memory?.usedPercent))}
            ${statCard('Containers', `${nas.docker?.running || 0}/${nas.docker?.total || 0}`, nas.docker?.configured ? 'Docker socket connected' : 'Docker socket not mounted', nas.docker?.configured ? 'green' : 'amber')}
          </div>
          <div class="split-layout">
            <section class="panel">
              <div class="panel-heading"><div><h2>Disks</h2><p>${(nas.disks || []).length} paths checked</p></div></div>
              <div class="resource-grid compact">
                ${(nas.disks || []).map(diskCard).join('') || '<div class="empty-state">No disk paths found.</div>'}
              </div>
            </section>
            <section class="panel">
              <div class="panel-heading"><div><h2>Network</h2><p>${(nas.network || []).length} interfaces</p></div></div>
              <div class="table">
                ${(nas.network || []).map(row => tableRow(row.name, `${formatBytes(row.rxBytes)} in - ${formatBytes(row.txBytes)} out`, `${row.rxPackets} / ${row.txPackets} packets`)).join('') || '<div class="empty-state">No network data.</div>'}
              </div>
            </section>
          </div>
          <section class="panel">
            <div class="panel-heading"><div><h2>Containers</h2><p>${nas.docker?.socket || ''}</p></div></div>
            <div class="table">
              ${(nas.docker?.containers || []).map(container => tableRow((container.names || []).join(', ') || container.id, container.image, container.status || container.state)).join('') || '<div class="empty-state">No containers visible.</div>'}
            </div>
          </section>
          <div class="log-grid">
            ${(nas.logs || []).map(fileLogPanel).join('') || '<div class="empty-state">No NAS log files visible.</div>'}
          </div>
        </div>
      `;
    }

    function renderHomeAssistant() {
      const ha = state.data.homeAssistant || {};
      if (!ha.configured) return `<div class="empty-state">${escapeHtml(ha.error || 'Home Assistant is not configured.')}</div>`;
      return `
        <div class="page-stack">
          <div class="stats-grid">
            ${statCard('Entities', String(ha.states?.total || 0), `${ha.states?.domains?.length || 0} domains`, 'cyan')}
            ${statCard('Problem states', String(ha.states?.problems?.length || 0), `${ha.states?.unavailable || 0} unavailable or unknown`, (ha.states?.problems?.length || 0) ? 'amber' : 'green')}
            ${statCard('Services', String(ha.servicesCount || 0), `${ha.eventsCount || 0} event types`, 'blue')}
            ${statCard('Version', ha.config?.version || '-', ha.config?.location_name || ha.config?.time_zone || '-', ha.ok ? 'green' : 'red')}
          </div>
          <div class="split-layout">
            <section class="panel">
              <div class="panel-heading"><div><h2>Domains</h2><p>Entity distribution</p></div></div>
              <div class="metric-list">
                ${(ha.states?.domains || []).map(domainBar).join('') || '<div class="empty-state">No state data.</div>'}
              </div>
            </section>
            <section class="panel">
              <div class="panel-heading"><div><h2>API endpoints</h2><p>${ha.baseUrl || ''}</p></div></div>
              <div class="table">
                ${(ha.endpoints || []).map(endpointRow).join('')}
              </div>
            </section>
          </div>
          <section class="panel">
            <div class="panel-heading"><div><h2>Problem states</h2><p>${ha.states?.problems?.length || 0} items</p></div></div>
            <div class="table">
              ${(ha.states?.problems || []).map(item => tableRow(item.name || item.entity_id, item.entity_id, `${item.reason || item.state} - ${formatDate(item.last_changed)}`)).join('') || '<div class="empty-state">No problem states.</div>'}
            </div>
          </section>
          <div class="log-grid">
            ${logPanel('Logbook', (ha.logbook || []).map(entry => `${formatDate(entry.when)}  ${entry.name || entry.entity_id || ''}  ${entry.message || ''}`))}
            ${logPanel('Error log', ha.errorLog || [])}
          </div>
        </div>
      `;
    }

    function renderUniFi() {
      const unifi = state.data.unifi || {};
      if (!unifi.configured) return `<div class="empty-state">${escapeHtml(unifi.error || 'UniFi Network is not configured.')}</div>`;
      return `
        <div class="page-stack">
          <section class="panel control-panel">
            <div>
              <h2>Site</h2>
              <p>${escapeHtml(siteLabel(unifi.site, unifi.sites))} - ${(unifi.sites || []).length || 1} discovered</p>
            </div>
            <label class="inline-field">
              <span>UniFi site</span>
              <select id="unifi-site-picker" ${state.user?.is_admin ? '' : 'disabled'}>
                ${renderUniFiSiteOptions(unifi.site, unifi.sites)}
              </select>
            </label>
          </section>
          <div class="stats-grid">
            ${statCard('Clients', String(unifi.clients?.total || 0), `Site ${unifi.site || '-'}`, 'cyan')}
            ${statCard('Devices', String(unifi.devices?.total || 0), `${unifi.devices?.offline || 0} offline`, (unifi.devices?.offline || 0) ? 'amber' : 'green')}
            ${statCard('Events', String((unifi.events || []).length), `${(unifi.alarms || []).length} alarms`, (unifi.alarms || []).length ? 'amber' : 'blue')}
            ${statCard('Controller', unifi.ok ? 'Online' : 'Check', unifi.baseUrl || unifi.error || '-', unifi.ok ? 'green' : 'red')}
          </div>
          <div class="split-layout">
            <section class="panel">
              <div class="panel-heading"><div><h2>Health</h2><p>${unifi.baseUrl || ''}</p></div></div>
              <div class="table">
                ${(unifi.health || []).map(row => tableRow(row.subsystem || row.name || row.status || 'Subsystem', statusText(row), healthMeta(row))).join('') || '<div class="empty-state">No health rows.</div>'}
              </div>
            </section>
            <section class="panel">
              <div class="panel-heading"><div><h2>API endpoints</h2><p>${unifi.site || ''}</p></div></div>
              <div class="table">
                ${(unifi.endpoints || []).map(endpointRow).join('')}
              </div>
            </section>
          </div>
          <section class="panel">
            <div class="panel-heading"><div><h2>Devices</h2><p>${unifi.devices?.total || 0} devices</p></div></div>
            <div class="table">
              ${(unifi.devices?.rows || []).map(device => tableRow(device.name || device.mac, `${device.model || device.type || '-'} ${device.ip ? '- ' + device.ip : ''}`, device.state === 1 || device.state === '1' ? 'Online' : 'Offline')).join('') || '<div class="empty-state">No devices.</div>'}
            </div>
          </section>
          <section class="panel">
            <div class="panel-heading"><div><h2>Clients</h2><p>${unifi.clients?.total || 0} clients</p></div></div>
            <div class="table">
              ${(unifi.clients?.rows || []).slice(0, 60).map(client => tableRow(client.name || client.mac, `${client.ip || '-'} ${client.essid ? '- ' + client.essid : ''}`, `${formatBytes(client.rxBytes)} in - ${formatBytes(client.txBytes)} out`)).join('') || '<div class="empty-state">No clients.</div>'}
            </div>
          </section>
          <div class="log-grid">
            ${logPanel('Events', (unifi.events || []).map(event => `${formatDate(event.time)}  ${event.device || event.subsystem || ''}  ${event.message || ''}`))}
            ${logPanel('Alarms', (unifi.alarms || []).map(event => `${formatDate(event.time)}  ${event.device || event.subsystem || ''}  ${event.message || ''}`))}
          </div>
        </div>
      `;
    }

    function normalizedUniFiSites(sites, currentSite) {
      const rows = Array.isArray(sites) ? sites : [];
      const seen = new Set();
      const normalized = [];
      for (const site of rows) {
        const name = String(site?.name || '').trim();
        if (!name || seen.has(name.toLowerCase())) continue;
        seen.add(name.toLowerCase());
        normalized.push({
          name,
          label: String(site?.label || name).trim() || name,
          siteId: String(site?.siteId || '').trim(),
          hostId: String(site?.hostId || '').trim(),
          role: String(site?.role || '').trim(),
        });
      }
      const current = String(currentSite || 'default').trim() || 'default';
      if (!seen.has(current.toLowerCase())) {
        normalized.unshift({ name: current, label: current, siteId: '', hostId: '', role: '' });
      }
      return normalized;
    }

    function siteLabel(currentSite, sites) {
      const current = String(currentSite || 'default');
      const site = normalizedUniFiSites(sites, current).find(item => item.name === current);
      return site ? `${site.label}${site.label !== site.name ? ` (${site.name})` : ''}` : current;
    }

    function renderUniFiSiteOptions(currentSite, sites) {
      const current = String(currentSite || 'default');
      return normalizedUniFiSites(sites, current).map(site => {
        const details = [site.name !== site.label ? site.name : '', site.role].filter(Boolean).join(' - ');
        const label = details ? `${site.label} (${details})` : site.label;
        return `<option value="${escapeHtml(site.name)}" ${site.name === current ? 'selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');
    }

    function renderUniFiSiteSetting(currentSite) {
      const sites = normalizedUniFiSites(state.data?.unifi?.sites, currentSite);
      if (sites.length <= 1 && !state.data?.unifi?.sites?.length) {
        return `<input name="unifiSite" value="${escapeHtml(currentSite || 'default')}" />`;
      }
      return `<select name="unifiSite">${renderUniFiSiteOptions(currentSite, sites)}</select>`;
    }

    function renderSites() {
      const sites = state.data.sites || {};
      return `
        <div class="page-stack">
          <div class="stats-grid">
            ${statCard('Total', String(sites.total || 0), 'Configured checks', 'cyan')}
            ${statCard('Reachable', String(sites.up || 0), 'Up or protected', 'green')}
            ${statCard('Down', String(sites.down || 0), 'Needs attention', sites.down ? 'red' : 'blue')}
            ${statCard('Disabled', String(sites.disabled || 0), 'Skipped checks', 'amber')}
          </div>
          <section class="panel">
            <div class="panel-heading"><div><h2>Status checks</h2><p>${formatDate(state.data.collectedAt)}</p></div></div>
            <div class="resource-grid">
              ${(sites.sites || []).map(siteCard).join('') || '<div class="empty-state">No sites configured.</div>'}
            </div>
          </section>
        </div>
      `;
    }

    function renderLogs() {
      const nas = state.data.nas || {};
      const ha = state.data.homeAssistant || {};
      const unifi = state.data.unifi || {};
      const wake = state.data.wake || {};
      return `
        <div class="log-grid">
          ${logPanel('Wake-on-LAN', (wake.log || []).map(entry => `${formatDate(entry.at)}  ${entry.ok ? 'sent' : 'failed'}  ${entry.deviceName || entry.deviceId || ''}  ${entry.displayName || entry.username || ''}${describeWakeAttempts(entry.attempts) ? '  ' + describeWakeAttempts(entry.attempts) : ''}${entry.error ? '  ' + entry.error : ''}`))}
          ${(nas.logs || []).map(fileLogPanel).join('') || logPanel('NAS logs', ['No NAS logs visible.'])}
          ${logPanel('Home Assistant logbook', (ha.logbook || []).map(entry => `${formatDate(entry.when)}  ${entry.name || entry.entity_id || ''}  ${entry.message || ''}`))}
          ${logPanel('Home Assistant errors', ha.errorLog || [])}
          ${logPanel('UniFi events', (unifi.events || []).map(event => `${formatDate(event.time)}  ${event.device || event.subsystem || ''}  ${event.message || ''}`))}
          ${logPanel('UniFi alarms', (unifi.alarms || []).map(event => `${formatDate(event.time)}  ${event.device || event.subsystem || ''}  ${event.message || ''}`))}
        </div>
      `;
    }

    function renderSettings() {
      if (!state.user?.is_admin) return '<div class="empty-state">Admin access required.</div>';
      const settings = state.settings || {};
      return `
        <form class="settings-form" id="settings-form">
          <section class="settings-section">
            <h2>NAS</h2>
            <label>
              <span>Public URL</span>
              <input name="nasPublicUrl" value="${escapeHtml(settings.nasPublicUrl || '')}" placeholder="https://board.chempner.ch" />
            </label>
            <label>
              <span>Disk paths</span>
              <textarea name="nasDiskPaths" placeholder="/data&#10;/host/mnt">${escapeHtml(formatPathList(settings.nasDiskPaths || ''))}</textarea>
            </label>
            <label>
              <span>Log files</span>
              <textarea name="nasLogFiles" placeholder="/host/var/log/syslog&#10;/host/var/log/messages">${escapeHtml(formatPathList(settings.nasLogFiles || ''))}</textarea>
            </label>
          </section>
          <section class="settings-section">
            <h2>Home Assistant</h2>
            <label>
              <span>URL</span>
              <input name="homeAssistantUrl" value="${escapeHtml(settings.homeAssistantUrl || '')}" placeholder="http://homeassistant.local:8123" />
            </label>
            <label>
              <span>Long-lived token ${settings.hasHomeAssistantToken ? '(configured)' : ''}</span>
              <input name="homeAssistantToken" type="password" value="" placeholder="Leave blank to keep" autocomplete="new-password" />
            </label>
            <label class="check-label">
              <input name="clearHomeAssistantToken" type="checkbox" />
              Clear token
            </label>
            <label>
              <span>Logbook hours</span>
              <input name="haLogbookHours" type="number" min="1" max="168" value="${escapeHtml(settings.haLogbookHours || 24)}" />
            </label>
          </section>
          <section class="settings-section">
            <h2>UniFi Network</h2>
            <label>
              <span>URL</span>
              <input name="unifiUrl" value="${escapeHtml(settings.unifiUrl || '')}" placeholder="https://10.13.37.1" />
            </label>
            <label>
              <span>Username</span>
              <input name="unifiUsername" value="${escapeHtml(settings.unifiUsername || '')}" autocomplete="off" />
            </label>
            <label>
              <span>Password ${settings.hasUnifiPassword ? '(configured)' : ''}</span>
              <input name="unifiPassword" type="password" value="" placeholder="Leave blank to keep" autocomplete="new-password" />
            </label>
            <label>
              <span>API key ${settings.hasUnifiApiKey ? '(configured)' : ''}</span>
              <input name="unifiApiKey" type="password" value="" placeholder="Leave blank to keep" autocomplete="new-password" />
            </label>
            <label class="check-label">
              <input name="clearUnifiPassword" type="checkbox" />
              Clear password
            </label>
            <label class="check-label">
              <input name="clearUnifiApiKey" type="checkbox" />
              Clear API key
            </label>
            <label>
              <span>Site</span>
              ${renderUniFiSiteSetting(settings.unifiSite || 'default')}
            </label>
            <label class="check-label">
              <input name="unifiInsecure" type="checkbox" ${settings.unifiInsecure === false ? '' : 'checked'} />
              Insecure TLS
            </label>
            <label>
              <span>Login paths</span>
              <input name="unifiLoginPaths" value="${escapeHtml(settings.unifiLoginPaths || '/api/auth/login,/api/login')}" />
            </label>
            <label>
              <span>API prefixes</span>
              <input name="unifiApiPrefixes" value="${escapeHtml(settings.unifiApiPrefixes || '/proxy/network,')}" />
            </label>
          </section>
          <section class="settings-section">
            <h2>Wake-on-LAN</h2>
            <label>
              <span>Default broadcast</span>
              <input name="wolDefaultBroadcast" value="${escapeHtml(settings.wolDefaultBroadcast || '255.255.255.255')}" />
            </label>
            <label>
              <span>Default port</span>
              <input name="wolDefaultPort" type="number" min="0" max="65535" value="${escapeHtml(settings.wolDefaultPort || 9)}" />
            </label>
            <label>
              <span>Extra broadcasts</span>
              <textarea name="wolExtraBroadcasts" rows="3" placeholder="10.13.37.255">${escapeHtml(settings.wolExtraBroadcasts || '')}</textarea>
            </label>
            <label>
              <span>Repeat count</span>
              <input name="wolRepeatCount" type="number" min="1" max="10" value="${escapeHtml(settings.wolRepeatCount || 3)}" />
            </label>
            <label>
              <span>Bind address</span>
              <input name="wolBindAddress" value="${escapeHtml(settings.wolBindAddress || '')}" />
            </label>
            <label>
              <span>Bind port</span>
              <input name="wolBindPort" type="number" min="0" max="65535" value="${escapeHtml(settings.wolBindPort || '')}" />
            </label>
          </section>
          <div class="notice full" id="settings-status"></div>
          <div class="page-actions full">
            <button class="primary-button" id="settings-save-btn" type="submit">Save settings</button>
          </div>
        </form>
      `;
    }

    function statCard(label, value, sub, tone) {
      return `<article class="stat-card tone-${tone || 'cyan'}"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value == null ? '-' : value)}</strong><small>${escapeHtml(sub || '')}</small></article>`;
    }

    function serviceCard(name, ok, target, meta) {
      return `<article class="resource-card">
        <header><span class="status-dot ${ok ? 'up' : 'down'}"></span><div><h2>${escapeHtml(name)}</h2><span>${escapeHtml(target || '-')}</span></div></header>
        <p>${escapeHtml(meta || '')}</p>
      </article>`;
    }

    function siteCard(site) {
      const stateClass = site.state === 'up' || site.state === 'protected' ? 'up' : site.state === 'disabled' ? 'warn' : 'down';
      const actions = state.user?.is_admin
        ? `<div class="chip-row"><button class="secondary-button" data-edit-site="${escapeHtml(site.id)}" type="button">Edit</button><button class="danger-button" data-delete-site="${escapeHtml(site.id)}" type="button">Delete</button></div>`
        : '';
      return `<article class="resource-card">
        <header><span class="status-dot ${stateClass}"></span><div><h2>${escapeHtml(site.name)}</h2><span>${escapeHtml(site.group || 'General')} - ${escapeHtml(site.kind || 'site')}</span></div></header>
        <p>${escapeHtml(site.url)}</p>
        <div class="chip-row">
          <span class="chip ${stateClass === 'down' ? 'red' : stateClass === 'warn' ? 'amber' : 'green'}">${escapeHtml(site.state || 'unknown')}</span>
          <span class="chip blue">${site.httpStatus || '-'}</span>
          <span class="chip">${site.latencyMs == null ? '-' : site.latencyMs + ' ms'}</span>
        </div>
        ${site.error ? `<p>${escapeHtml(site.error)}</p>` : ''}
        ${(site.tags || []).length ? `<div class="chip-row">${site.tags.map(tag => `<span class="chip">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
        ${actions}
      </article>`;
    }

    function wakeDeviceCard(device) {
      const message = state.wakeMessages.get(device.id);
      const targets = Array.isArray(device.targets) && device.targets.length ? device.targets : [device.broadcast];
      const targetText = targets.map(target => `${target}:${device.port}`).join(', ');
      const summary = device.description || `${device.mac} via ${targetText}`;
      const actions = [
        `<button class="primary-button" data-wake-device="${escapeHtml(device.id)}" type="button" ${device.enabled ? '' : 'disabled'}>Wake</button>`,
      ];
      if (state.user?.is_admin) {
        actions.push(`<button class="secondary-button" data-edit-wake="${escapeHtml(device.id)}" type="button">Edit</button>`);
        actions.push(`<button class="danger-button" data-delete-wake="${escapeHtml(device.id)}" type="button">Delete</button>`);
      }
      return `<article class="resource-card ${device.enabled ? '' : 'disabled'}">
        <header><span class="status-dot ${device.enabled ? 'up' : 'warn'}"></span><div><h2>${escapeHtml(device.name)}</h2><span>${escapeHtml(device.enabled ? 'Enabled' : 'Disabled')}</span></div></header>
        <p>${escapeHtml(summary)}</p>
        <div class="metric-list">
          <div class="metric-row"><strong>MAC</strong><div>${escapeHtml(device.mac)}</div></div>
          <div class="metric-row"><strong>Broadcast</strong><div>${escapeHtml(targetText)}</div></div>
          <div class="metric-row"><strong>Last wake</strong><div>${escapeHtml(device.lastWakeAt ? `${formatDate(device.lastWakeAt)} by ${device.lastWakeBy || '-'}` : 'Never')}</div></div>
        </div>
        ${(device.tags || []).length ? `<div class="chip-row">${device.tags.map(tag => `<span class="chip">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
        ${message ? `<p class="muted">${escapeHtml(message)}</p>` : ''}
        <div class="chip-row">${actions.join('')}</div>
      </article>`;
    }

    function diskCard(disk) {
      if (disk.error) return `<article class="resource-card"><h2>${escapeHtml(disk.path)}</h2><p>${escapeHtml(disk.error)}</p></article>`;
      const tone = disk.usedPercent >= 90 ? 'danger' : disk.usedPercent >= 75 ? 'warn' : '';
      return `<article class="resource-card">
        <h2>${escapeHtml(disk.mount || disk.path)}</h2>
        <span>${escapeHtml(disk.filesystem || disk.path)}</span>
        <div class="bar ${tone}" style="--value:${Number(disk.usedPercent || 0)}%"><span></span></div>
        <p>${percentText(disk.usedPercent)} used - ${formatBytes(disk.availableBytes || 0)} free of ${formatBytes(disk.sizeBytes || 0)}</p>
      </article>`;
    }

    function domainBar(row) {
      const total = state.data.homeAssistant?.states?.total || 1;
      const value = Math.round((row.count / total) * 1000) / 10;
      return `<div class="metric-row"><strong>${escapeHtml(row.domain)}</strong><div><div class="bar" style="--value:${value}%"><span></span></div><span class="muted">${row.count} entities</span></div></div>`;
    }

    function endpointRow(endpoint) {
      return tableRow(endpoint.name, endpoint.ok ? 'OK' : endpoint.error || 'Failed', endpoint.status ? `HTTP ${endpoint.status}` : '');
    }

    function tableRow(title, detail, meta) {
      return `<div class="table-row"><div><strong>${escapeHtml(title || '-')}</strong><span>${escapeHtml(detail || '')}</span></div><span>${escapeHtml(meta || '')}</span></div>`;
    }

    function describeWakeAttempts(attempts) {
      if (!Array.isArray(attempts) || !attempts.length) return '';
      const sent = attempts.filter(attempt => attempt.ok).length;
      const targets = [...new Set(attempts.map(attempt => attempt.target).filter(Boolean))];
      const targetText = targets.length ? ` to ${targets.join(', ')}` : '';
      return `${sent}/${attempts.length} UDP sends${targetText}`;
    }

    function wakeLogMeta(entry) {
      const parts = [formatDate(entry.at)];
      const attempts = describeWakeAttempts(entry.attempts);
      if (attempts) parts.push(attempts);
      if (entry.error) parts.push(entry.error);
      return parts.join(' - ');
    }

    function fileLogPanel(file) {
      return logPanel(`${file.label || file.path}`, file.error ? [file.error] : file.lines || [], file.path);
    }

    function logPanel(title, lines, subtitle) {
      const text = (lines || []).length ? lines.join('\n') : 'No entries.';
      return `<section class="log-panel"><h2>${escapeHtml(title)}</h2>${subtitle ? `<span class="muted">${escapeHtml(subtitle)}</span>` : ''}<pre>${escapeHtml(text)}</pre></section>`;
    }

    function statusText(row) {
      return row.status || row.state || row.subsystem || row.name || '-';
    }

    function healthMeta(row) {
      const parts = [];
      for (const key of ['num_user', 'num_ap', 'num_sw', 'num_gw', 'num_adopted']) {
        if (row[key] !== undefined) parts.push(`${key.replace('num_', '')}: ${row[key]}`);
      }
      return parts.join(' - ');
    }

    function bindUniFiControls() {
      const picker = document.getElementById('unifi-site-picker');
      if (!picker) return;
      picker.addEventListener('change', saveUniFiSite);
    }

    async function saveUniFiSite(event) {
      if (!state.user?.is_admin) return;
      const picker = event.currentTarget;
      const nextSite = picker.value;
      const previousSite = state.data?.unifi?.site || state.settings?.unifiSite || 'default';
      if (!nextSite || nextSite === previousSite) return;
      picker.disabled = true;
      showNotice('');
      try {
        const saved = await api('/api/settings', {
          method: 'PUT',
          body: JSON.stringify({ unifiSite: nextSite }),
        });
        state.settings = saved.settings;
        await refreshDashboard({ quiet: true });
      } catch (error) {
        picker.value = previousSite;
        showNotice(error.message);
        render();
      }
    }

    function bindSettingsForm() {
      const form = document.getElementById('settings-form');
      if (!form) return;
      form.addEventListener('submit', saveSettings);
    }

    async function saveSettings(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const status = document.getElementById('settings-status');
      const button = document.getElementById('settings-save-btn');
      status.textContent = '';
      status.className = 'notice full';
      button.disabled = true;

      const field = name => form.elements.namedItem(name);
      const payload = {
        nasPublicUrl: field('nasPublicUrl').value,
        nasDiskPaths: normalizePathList(field('nasDiskPaths').value),
        nasLogFiles: normalizePathList(field('nasLogFiles').value),
        homeAssistantUrl: field('homeAssistantUrl').value,
        homeAssistantToken: field('homeAssistantToken').value,
        clearHomeAssistantToken: field('clearHomeAssistantToken').checked,
        haLogbookHours: Number(field('haLogbookHours').value || 24),
        unifiUrl: field('unifiUrl').value,
        unifiUsername: field('unifiUsername').value,
        unifiPassword: field('unifiPassword').value,
        clearUnifiPassword: field('clearUnifiPassword').checked,
        unifiApiKey: field('unifiApiKey').value,
        clearUnifiApiKey: field('clearUnifiApiKey').checked,
        unifiSite: field('unifiSite').value,
        unifiInsecure: field('unifiInsecure').checked,
        unifiLoginPaths: field('unifiLoginPaths').value,
        unifiApiPrefixes: field('unifiApiPrefixes').value,
        wolDefaultBroadcast: field('wolDefaultBroadcast').value,
        wolDefaultPort: Number(field('wolDefaultPort').value || 9),
        wolExtraBroadcasts: normalizePathList(field('wolExtraBroadcasts').value),
        wolRepeatCount: Number(field('wolRepeatCount').value || 3),
        wolBindAddress: field('wolBindAddress').value,
        wolBindPort: field('wolBindPort').value,
      };

      try {
        const saved = await api('/api/settings', {
          method: 'PUT',
          body: JSON.stringify(payload),
        });
        state.settings = saved.settings;
        field('homeAssistantToken').value = '';
        field('unifiPassword').value = '';
        field('unifiApiKey').value = '';
        field('clearHomeAssistantToken').checked = false;
        field('clearUnifiPassword').checked = false;
        field('clearUnifiApiKey').checked = false;
        status.textContent = 'Settings saved.';
        status.className = 'notice ok show full';
        await refreshDashboard({ quiet: true });
      } catch (error) {
        status.textContent = error.message;
        status.className = 'notice show full';
      } finally {
        button.disabled = false;
      }
    }

    function bindSiteButtons() {
      document.querySelectorAll('[data-edit-site]').forEach(button => {
        button.addEventListener('click', () => {
          const site = (state.data.sites?.sites || []).find(item => item.id === button.dataset.editSite);
          if (site) openSiteDialog(site);
        });
      });
      document.querySelectorAll('[data-delete-site]').forEach(button => {
        button.addEventListener('click', () => deleteSite(button.dataset.deleteSite));
      });
    }

    function bindWakeButtons() {
      document.querySelectorAll('[data-wake-device]').forEach(button => {
        button.addEventListener('click', () => wakeDevice(button.dataset.wakeDevice));
      });
      document.querySelectorAll('[data-edit-wake]').forEach(button => {
        button.addEventListener('click', () => {
          const device = (state.data.wake?.devices || []).find(item => item.id === button.dataset.editWake);
          if (device) openWakeDialog(device);
        });
      });
      document.querySelectorAll('[data-delete-wake]').forEach(button => {
        button.addEventListener('click', () => deleteWakeDevice(button.dataset.deleteWake));
      });
    }

    function openWakeDialog(device = null) {
      state.editingWakeDeviceId = device?.id || null;
      document.getElementById('wake-dialog-title').textContent = device ? 'Edit machine' : 'Add machine';
      wakeField('name').value = device?.name || '';
      wakeField('mac').value = device?.mac || '';
      wakeField('broadcast').value = device?.broadcast || state.settings?.wolDefaultBroadcast || '255.255.255.255';
      wakeField('port').value = device?.port || state.settings?.wolDefaultPort || 9;
      wakeField('tags').value = (device?.tags || []).join(', ');
      wakeField('description').value = device?.description || '';
      wakeField('enabled').checked = device?.enabled !== false;
      wakeStatus.textContent = '';
      wakeStatus.classList.remove('show');
      wakeDialog.showModal();
    }

    function wakeField(name) {
      return wakeForm.elements.namedItem(name);
    }

    async function saveWakeDevice(event) {
      event.preventDefault();
      wakeStatus.textContent = '';
      wakeStatus.classList.remove('show');
      const button = document.getElementById('wake-save-btn');
      button.disabled = true;
      try {
        const body = {
          name: wakeField('name').value,
          mac: wakeField('mac').value,
          broadcast: wakeField('broadcast').value,
          port: Number(wakeField('port').value || 9),
          tags: wakeField('tags').value,
          description: wakeField('description').value,
          enabled: wakeField('enabled').checked,
        };
        const path = state.editingWakeDeviceId ? `/api/wol/devices/${encodeURIComponent(state.editingWakeDeviceId)}` : '/api/wol/devices';
        await api(path, {
          method: state.editingWakeDeviceId ? 'PUT' : 'POST',
          body: JSON.stringify(body),
        });
        wakeDialog.close();
        await refreshDashboard();
      } catch (error) {
        wakeStatus.textContent = error.message;
        wakeStatus.classList.add('show');
      } finally {
        button.disabled = false;
      }
    }

    async function wakeDevice(deviceId) {
      state.wakeMessages.set(deviceId, 'Sending wake packet...');
      render();
      try {
        const response = await api(`/api/wol/devices/${encodeURIComponent(deviceId)}/wake`, { method: 'POST' });
        const attemptText = describeWakeAttempts(response.attempts);
        state.wakeMessages.set(deviceId, attemptText ? `Wake packet sent: ${attemptText}.` : 'Wake packet sent.');
        await refreshDashboard({ quiet: true });
      } catch (error) {
        const attemptText = describeWakeAttempts(error.attempts);
        state.wakeMessages.set(deviceId, attemptText ? `${error.message} (${attemptText})` : error.message);
        render();
      }
    }

    async function deleteWakeDevice(deviceId) {
      if (!confirm('Delete this wake machine?')) return;
      await api(`/api/wol/devices/${encodeURIComponent(deviceId)}`, { method: 'DELETE' });
      state.wakeMessages.delete(deviceId);
      await refreshDashboard();
    }

    function openSiteDialog(site = null) {
      state.editingSiteId = site?.id || null;
      document.getElementById('site-dialog-title').textContent = site ? 'Edit site' : 'Add site';
      siteField('name').value = site?.name || '';
      siteField('group').value = site?.group || 'General';
      siteField('url').value = site?.url || '';
      siteField('kind').value = site?.kind || 'site';
      siteField('method').value = site?.method || 'GET';
      siteField('timeoutMs').value = site?.timeoutMs || 4500;
      siteField('tags').value = (site?.tags || []).join(', ');
      siteField('enabled').checked = site?.enabled !== false;
      siteStatus.textContent = '';
      siteStatus.classList.remove('show');
      siteDialog.showModal();
    }

    function siteField(name) {
      return siteForm.elements.namedItem(name);
    }

    async function saveSite(event) {
      event.preventDefault();
      siteStatus.textContent = '';
      siteStatus.classList.remove('show');
      const button = document.getElementById('site-save-btn');
      button.disabled = true;
      try {
        const body = {
          name: siteField('name').value,
          group: siteField('group').value,
          url: siteField('url').value,
          kind: siteField('kind').value,
          method: siteField('method').value,
          timeoutMs: Number(siteField('timeoutMs').value || 4500),
          tags: siteField('tags').value,
          enabled: siteField('enabled').checked,
        };
        const path = state.editingSiteId ? `/api/sites/${encodeURIComponent(state.editingSiteId)}` : '/api/sites';
        await api(path, {
          method: state.editingSiteId ? 'PUT' : 'POST',
          body: JSON.stringify(body),
        });
        siteDialog.close();
        await refreshDashboard();
      } catch (error) {
        siteStatus.textContent = error.message;
        siteStatus.classList.add('show');
      } finally {
        button.disabled = false;
      }
    }

    async function deleteSite(siteId) {
      if (!confirm('Delete this site check?')) return;
      await api(`/api/sites/${encodeURIComponent(siteId)}`, { method: 'DELETE' });
      await refreshDashboard();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(Number(seconds))) return '-';
      let remaining = Math.floor(Number(seconds));
      const days = Math.floor(remaining / 86400);
      remaining -= days * 86400;
      const hours = Math.floor(remaining / 3600);
      remaining -= hours * 3600;
      const minutes = Math.floor(remaining / 60);
      if (days) return `${days}d ${hours}h`;
      if (hours) return `${hours}h ${minutes}m`;
      return `${minutes}m`;
    }

    function formatBytes(bytes) {
      const value = Number(bytes || 0);
      if (!Number.isFinite(value)) return '-';
      const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
      let size = Math.abs(value);
      let index = 0;
      while (size >= 1024 && index < units.length - 1) {
        size /= 1024;
        index += 1;
      }
      const number = size >= 10 || index === 0 ? Math.round(size) : Math.round(size * 10) / 10;
      return `${number}${units[index]}`;
    }

    function percentText(value) {
      return value == null || Number.isNaN(Number(value)) ? '-' : `${Number(value)}%`;
    }

    function formatPathList(value) {
      return String(value || '')
        .split(/[,\n]/)
        .map(item => item.trim())
        .filter(Boolean)
        .join('\n');
    }

    function normalizePathList(value) {
      return formatPathList(value);
    }

    function memoryTone(value) {
      const number = Number(value);
      if (number >= 90) return 'red';
      if (number >= 75) return 'amber';
      return 'green';
    }
  </script>
</body>
</html>
