<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password reset - ChempBoard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #030813;
      --panel: #202b3a;
      --panel-soft: #14202d;
      --ink: #eef4fb;
      --muted: #aab3c2;
      --line: #374456;
      --green: #0f766e;
      --green-dark: #0d9488;
      --red: #fca5a5;
      --teal: #5eead4;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #030813;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
    }
    h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0; }
    p { margin: 6px 0 20px; color: var(--muted); }
    form { display: grid; gap: 14px; }
    label {
      display: grid;
      gap: 6px;
      color: #d5dde8;
      font-size: 0.78rem;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: var(--panel-soft);
      color: var(--ink);
      font: inherit;
      text-transform: none;
      letter-spacing: 0;
    }
    input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.15);
    }
    button {
      min-height: 42px;
      border: 1px solid rgba(94, 234, 212, 0.34);
      border-radius: 8px;
      background: var(--green);
      color: #ecfeff;
      cursor: pointer;
      font: inherit;
      font-weight: 850;
    }
    button:hover { background: var(--green-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    a { color: #99f6e4; font-weight: 850; text-decoration: none; }
    .status { min-height: 22px; font-size: 0.9rem; color: var(--red); }
    .status.ok { color: #86efac; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Reset password</h1>
    <p id="copy">Enter your username or email.</p>

    <form id="request-form">
      <label>
        Username or email
        <input id="identifier" autocomplete="username" required />
      </label>
      <button id="request-btn" type="submit">Send reset link</button>
      <div class="status" id="request-status"></div>
    </form>

    <form class="hidden" id="reset-form">
      <label>
        New password
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label>
        Confirm password
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <button id="reset-btn" type="submit">Save password</button>
      <div class="status" id="reset-status"></div>
    </form>

    <p><a href="/login">Back to sign in</a></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('t') || '';
    const requestForm = document.getElementById('request-form');
    const resetForm = document.getElementById('reset-form');
    const requestStatus = document.getElementById('request-status');
    const resetStatus = document.getElementById('reset-status');

    if (token) {
      document.getElementById('title').textContent = 'Choose a new password';
      document.getElementById('copy').textContent = 'Your reset link is active.';
      requestForm.classList.add('hidden');
      resetForm.classList.remove('hidden');
    }

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      requestStatus.textContent = '';
      requestStatus.className = 'status';
      const button = document.getElementById('request-btn');
      button.disabled = true;
      button.textContent = 'Sending...';
      try {
        const response = await fetch('/api/auth/request-password-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: document.getElementById('identifier').value }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not request reset link');
        requestStatus.textContent = data.message || 'If that account exists, a reset link has been sent.';
        requestStatus.className = 'status ok';
      } catch (error) {
        requestStatus.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'Send reset link';
      }
    });

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetStatus.textContent = '';
      resetStatus.className = 'status';
      const first = document.getElementById('new-password').value;
      const second = document.getElementById('confirm-password').value;
      if (first !== second) {
        resetStatus.textContent = 'Passwords do not match';
        return;
      }
      const button = document.getElementById('reset-btn');
      button.disabled = true;
      button.textContent = 'Saving...';
      try {
        const response = await fetch('/api/auth/complete-password-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset_token: token, new_password: first }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not reset password');
        resetStatus.textContent = 'Password saved. You can sign in now.';
        resetStatus.className = 'status ok';
      } catch (error) {
        resetStatus.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'Save password';
      }
    });
  </script>
</body>
</html>
